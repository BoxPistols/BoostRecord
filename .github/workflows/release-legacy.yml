name: Release (BoostRecord — full/legacy app)

# Builds the full-featured app (browser/ + lib/, Electron 28) into installers on
# macOS (dmg/zip arm64+x64) and Windows (nsis) and publishes them to a GitHub
# Release. This is the primary "BoostRecord" product (io.boxpistols.boostrecord).
# The modern app/ shell ("BoostRecord Next", io.boxpistols.boostrecord.next)
# ships separately via release.yml on `app-v*` tags.
#
# Trigger by pushing a tag like `v0.16.1` (the `v*` glob does NOT match `app-v*`):
#   git tag v0.16.1 && git push origin v0.16.1
#
# Builds are currently UNSIGNED (no code-signing certificates configured), so
# macOS/Windows warn on first launch — see the README for the quarantine /
# SmartScreen workaround. Add APPLE_* / WIN_CSC_* secrets and wire them here to
# ship signed + notarized artifacts. No untrusted event input is referenced in
# any run: step; GITHUB_TOKEN is a repo secret.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build & publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Run the two OS jobs SEQUENTIALLY. Both call `electron-builder --publish
      # always`, which creates the GitHub Release for the tag; run in parallel
      # they race to POST /releases and the loser fails with
      # "422 already_exists (tag_name)". Sequential = the first job creates the
      # release, the second finds it and just uploads its installers.
      max-parallel: 1
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        # Reads the pnpm version from package.json "packageManager".
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Rewrite git:// to https://
        # A transitive dependency (eve, via Raphael/snap.svg) is referenced over
        # the unauthenticated git:// protocol, which GitHub disabled in 2022.
        run: git config --global url."https://github.com/".insteadOf "git://github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer (Vite production)
        # Produces compiled/main.js.
        run: pnpm run compile

      - name: Package (unpacked, for pre-publish verification)
        # Fast --dir build so the packaged app (devDependencies pruned) can be
        # verified BEFORE anything is published.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --dir

      - name: Verify packaged runtime imports
        # Every bare runtime import in the bundle must resolve inside the
        # packaged node_modules (catches deps wrongly placed in devDependencies).
        run: node scripts/check-packaged-requires.mjs

      - name: E2E on packaged app (macOS)
        if: runner.os == 'macOS'
        # Boots the actual packaged .app and drives the real UI: create note →
        # type → save → note-list title. Publishing is gated on this passing.
        run: |
          APP="$(find release -maxdepth 2 -name 'BoostRecord.app' -print -quit)"
          test -n "$APP" || { echo "packaged app not found"; exit 1; }
          set +e
          TB_E2E_PROBE="$PWD/dev-scripts/e2e-probe.js" \
          TB_E2E_RESULT="$RUNNER_TEMP/tb-e2e.json" \
            "$APP/Contents/MacOS/BoostRecord"
          CODE=$?
          set -e
          cat "$RUNNER_TEMP/tb-e2e.json" || true
          exit $CODE

      - name: E2E on packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "release\win-unpacked\BoostRecord.exe"
          if (-not (Test-Path $exe)) { throw "packaged app not found" }
          $env:TB_E2E_PROBE = "$PWD\dev-scripts\e2e-probe.js"
          $env:TB_E2E_RESULT = "$env:RUNNER_TEMP\tb-e2e.json"
          # The runner's sandboxed GPU process crashes until Electron gives up;
          # the probe turns off the GPU sandbox (see dev-scripts/e2e-probe.js).
          $env:TB_E2E_DISABLE_GPU = "1"
          $p = Start-Process -FilePath $exe -Wait -PassThru
          Get-Content $env:TB_E2E_RESULT -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "packaged e2e failed (exit $($p.ExitCode))" }

      - name: Package & publish installers
        # Only reached when the packaged-app E2E passed. electron-builder
        # targets the host platform: macOS runner -> dmg/zip (arm64 + x64),
        # Windows runner -> nsis. Unsigned (identity is null and CSC
        # auto-discovery is disabled).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --publish always

  intel-smoke:
    # The x64 (Intel) mac build is cross-compiled on the arm64 runner above
    # and was never launched in CI. Download the x64 zip that `build` just
    # published and boot it on an Intel runner, so a broken Intel build is
    # visible. Intel is a fallback target (see docs/install.md "対応環境"), so
    # this job is informational: it runs after publishing and never blocks it.
    # GitHub retires its last Intel macOS runner (macos-15-intel) in fall 2027;
    # drop this job then and fall back to a manual check on an Intel Mac.
    name: smoke published x64 build on Intel (informational)
    needs: build
    runs-on: macos-15-intel
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Checkout
        # Only for package.json (version) and dev-scripts/e2e-probe.js.
        uses: actions/checkout@v4

      - name: Download published x64 app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release download "v$VERSION" -p "BoostRecord-$VERSION-x64.zip" -D "$RUNNER_TEMP/dl"
          ditto -x -k "$RUNNER_TEMP/dl/BoostRecord-$VERSION-x64.zip" "$RUNNER_TEMP/app"
          file "$RUNNER_TEMP/app/BoostRecord.app/Contents/MacOS/BoostRecord"

      - name: E2E on published x64 app
        # Same probe as the arm64 job: create note → type → save → title.
        # The probe's 90s watchdog timed out on a slow Intel Mac, so give
        # the Intel runner 5 minutes.
        env:
          TB_E2E_WATCHDOG_MS: '300000'
        run: |
          APP="$RUNNER_TEMP/app/BoostRecord.app"
          set +e
          TB_E2E_PROBE="$PWD/dev-scripts/e2e-probe.js" \
          TB_E2E_RESULT="$RUNNER_TEMP/tb-e2e.json" \
            "$APP/Contents/MacOS/BoostRecord"
          CODE=$?
          set -e
          cat "$RUNNER_TEMP/tb-e2e.json" || true
          exit $CODE

  notes:
    # electron-builder leaves the GitHub Release body empty, so the page never
    # said which of the 3 installers to pick. Fill it from the template once
    # all installers are up; a body someone already wrote is left alone.
    name: release notes
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fill empty release body with download guide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          BODY="$(gh release view "$TAG" --json body -q .body)"
          if [ -n "$BODY" ]; then echo "body already set; skip"; exit 0; fi
          # Asset names come from package.json, not the tag, so use the same source
          VERSION="$(node -p "require('./package.json').version")"
          sed "s/__VERSION__/$VERSION/g" .github/release-notes-template.md > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
